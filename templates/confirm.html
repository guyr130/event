<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>אישור הגעה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    direction: rtl;
    text-align: center;
    background: #ffffff;
">

<div style="max-width:420px; margin:0 auto; padding:20px;">

    <img
        src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
        alt="לוגו אור למשפחות"
        style="display:block; width:100%; max-width:260px; margin:0 auto 24px auto;"
    >

    <h1 style="color:#0b5fa5;">אישור הגעה</h1>

    <p style="font-size:18px;">
        משפחת <strong>{{ family_name }}</strong> היקרה,
    </p>

    <p style="font-size:17px; line-height:1.6;">
        אושרו לכם <strong>{{ tickets }}</strong> כרטיסים לאירוע<br>
        <strong>{{ event_name }}</strong><br>
        בתאריך {{ event_date }}<br>
        בשעה <strong>{{ event_time }}</strong><br>
        במקום {{ location }}
    </p>

    <p style="margin-top:20px;">בחרו כמות:</p>

    <select id="qty" style="
        padding:10px;
        font-size:16px;
        width:160px;
        text-align:center;
        margin-bottom:20px;
    ">
        <option value="">אנא בחרו כמות</option>
        {% set t = (tickets | int) %}
        {% for i in range(1, t + 1) %}
            <option value="{{ i }}">{{ i }}</option>
        {% endfor %}
    </select>

    <div style="
        max-width:320px;
        margin:0 auto 20px auto;
        text-align:right;
        background:#f7f7f7;
        border:1px solid #e3e3e3;
        border-radius:10px;
        padding:14px;
    ">
        <label for="photo" style="display:block; font-size:15px; font-weight:bold; margin-bottom:8px;">
            אפשר לצרף תמונה או PDF (עד 5MB)
        </label>

        <input
            type="file"
            id="photo"
            accept=".jpg,.jpeg,.png,.webp,.pdf"
            style="display:block; width:100%; font-size:14px;"
        >

        <div style="margin-top:8px; font-size:13px; color:#666;">
            שם הקובץ יישמר לפי מספר המשפחה
        </div>
    </div>

    <div id="statusMsg" style="font-size:16px; margin:10px 0; color:green;"></div>

    <div>
        <button id="yesBtn" onclick="sendResponse('yes')" style="
            width:220px;
            padding:14px;
            font-size:16px;
            background:#0b5fa5;
            color:#ffffff;
            border:none;
            border-radius:6px;
            margin-bottom:12px;
            cursor:pointer;
        ">
            מגיעים
        </button>

        <br>

        <button id="noBtn" onclick="sendResponse('no')" style="
            width:220px;
            padding:14px;
            font-size:16px;
            background:#f28c28;
            color:#ffffff;
            border:none;
            border-radius:6px;
            cursor:pointer;
        ">
            לא מגיעים
        </button>
    </div>

</div>

<script>
let alreadySent = false;

function lockUI(message) {
    document.getElementById("yesBtn").disabled = true;
    document.getElementById("noBtn").disabled = true;
    document.getElementById("yesBtn").style.opacity = 0.6;
    document.getElementById("noBtn").style.opacity = 0.6;
    document.getElementById("statusMsg").innerText = message;
}

function unlockUI(message) {
    alreadySent = false;
    document.getElementById("yesBtn").disabled = false;
    document.getElementById("noBtn").disabled = false;
    document.getElementById("yesBtn").style.opacity = 1;
    document.getElementById("noBtn").style.opacity = 1;
    document.getElementById("statusMsg").innerText = message;
}

function sendResponse(status) {
    if (alreadySent) return;
    alreadySent = true;

    const qtySelect = document.getElementById("qty");
    const photoInput = document.getElementById("photo");
    let qty = qtySelect.value;

    if (status === "yes" && !qty) {
        alert("אנא בחרו כמות כרטיסים");
        alreadySent = false;
        return;
    }

    if (status === "no") {
        qty = 0;
    }

    const file = photoInput.files[0];
    if (file && file.size > 5 * 1024 * 1024) {
        alert("הקובץ גדול מדי. אפשר להעלות עד 5MB בלבד.");
        alreadySent = false;
        return;
    }

    lockUI("האישור נשלח, אנא המתינו…");

    const formData = new FormData();
    formData.append("event_id", "{{ event_id }}");
    formData.append("family_id", "{{ family_id }}");
    formData.append("family_name", "{{ family_name }}");
    formData.append("event_name", "{{ event_name }}");
    formData.append("status", status);
    formData.append("tickets", qty);

    if (file) {
        formData.append("photo", file);
    }

    fetch("/submit", {
        method: "POST",
        body: formData
    })
    .then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
            throw new Error(data.error || "Server error");
        }
        return data;
    })
    .then(() => {
        window.location.href =
          "/thanks?status=" + status +
          "&qty=" + qty +
          "&event_id={{ event_id }}" +
          "&family_id={{ family_id }}";
    })
    .catch(err => {
        unlockUI(err.message || "אירעה שגיאה בשליחה, אנא נסו שוב");
    });
}
</script>

</body>
</html>
