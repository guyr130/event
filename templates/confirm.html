<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אישור הגעה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <img
        src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
        alt="לוגו אור למשפחות"
        class="logo"
    >

    <h1>אישור הגעה</h1>

    <p><strong>{{ event_name }}</strong></p>
    <p>📅 {{ event_date }}</p>

    {% if event_time %}
    <p>⏰ {{ event_time }}</p>
    {% endif %}

    {% if location %}
    <p>📍 {{ location }}</p>
    {% endif %}

    <div class="buttons">
        <a class="yes" href="#">מגיעים</a>
        <a class="no" href="#">לא מגיעים</a>
    </div>

</div>

</body>
</html>
