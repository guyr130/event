<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אישור הגעה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
    text-align:center;
">

<div style="max-width:420px; margin:0 auto; padding:20px;">

    <img
        src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
        alt="לוגו אור למשפחות"
        style="display:block; width:100%; max-width:260px; margin:0 auto 24px auto;"
    >

    <h1 style="color:#0b5fa5;">אישור הגעה</h1>

    <!-- פרטי האירוע -->
    <div style="
        background:#f4f6f8;
        border-radius:10px;
        padding:16px;
        margin-bottom:20px;
        text-align:right;
    ">
        <div style="font-size:18px; font-weight:bold;">
            {{ event_name }}
        </div>
        <div>📅 {{ event_date }} | ⏰ {{ event_time }}</div>
        <div>📍 {{ location }}</div>
    </div>

    <p>אנא אשרו את הגעתכם לאירוע</p>

    <!-- טופס אישור -->
    <form method="post" action="/confirm_submit">

        <input type="hidden" name="family_id" value="{{ family_id }}">
        <input type="hidden" name="event_id" value="{{ event_id }}">

        <!-- בחירת מספר משתתפים -->
        <div id="count_box" style="display:none; margin-bottom:20px;">
            <label>מספר משתתפים:</label><br>
            <select name="count" style="padding:8px; font-size:16px;">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>

        <!-- כפתורים -->
        <button type="button"
                onclick="showCount()"
                style="
                    width:220px;
                    padding:14px;
                    font-size:16px;
                    background:#0b5fa5;
                    color:#ffffff;
                    border:none;
                    border-radius:6px;
                    margin-bottom:12px;
                ">
            מגיעים
        </button>

        <button type="submit"
                name="status"
                value="no"
                style="
                    width:220px;
                    padding:14px;
                    font-size:16px;
                    background:#f28c28;
                    color:#ffffff;
                    border:none;
                    border-radius:6px;
                ">
            לא מגיעים
        </button>

        <!-- שליחה סופית -->
        <div id="submit_box" style="display:none; margin-top:12px;">
            <button type="submit"
                    name="status"
                    value="yes"
                    style="
                        width:220px;
                        padding:14px;
                        font-size:16px;
                        background:#2e7d32;
                        color:#ffffff;
                        border:none;
                        border-radius:6px;
                    ">
                אישור הגעה
            </button>
        </div>

    </form>

</div>

<script>
function showCount() {
    document.getElementById("count_box").style.display = "block";
    document.getElementById("submit_box").style.display = "block";
}
</script>

</body>
</html>
