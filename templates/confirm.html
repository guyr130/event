<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>אישור הגעה</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f2f2f2;
      text-align:center;
      color:#123;
    }
    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:24px 16px 40px;
    }
    .logo{
      max-width:300px;
      width:100%;
      height:auto;
      margin:0 auto 16px;
      display:block;
    }
    h1{
      color:#005aa7;
      margin:8px 0 22px;
      font-size:24px;
    }
    .card{
      background:#fff;
      border-radius:18px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      padding:24px 18px;
      margin:18px auto;
    }
    .event-box{
      margin-bottom:24px;
    }
    .event-title{
      font-size:28px;
      font-weight:700;
      color:#005aa7;
      margin-bottom:10px;
    }
    .event-line{
      font-size:20px;
      margin:8px 0;
    }
    .upload-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:14px;
    }
    .file-row{
      margin:14px 0;
    }
    input[type="file"]{
      font-size:18px;
      max-width:100%;
    }
    .btn{
      background:#0a67b2;
      color:#fff;
      border:none;
      border-radius:12px;
      padding:14px 28px;
      font-size:18px;
      cursor:pointer;
      margin-top:12px;
    }
    .btn:hover{
      background:#095a99;
    }
    .btn.secondary{
      background:#d9d9d9;
      color:#222;
    }
    .btn.secondary:hover{
      background:#c9c9c9;
    }
    .actions{
      margin-top:20px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .msg{
      margin-top:14px;
      font-size:18px;
      min-height:24px;
    }
    .msg.error{
      color:#c40000;
    }
    .msg.ok{
      color:#138000;
    }
    .small{
      font-size:16px;
      color:#555;
      margin-top:8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://or4family.co.il/wp-content/uploads/2024/09/Or-logo-1.png" alt="אור למשפחות">

    {% if has_event %}
      <h1>אישור הגעה לאירוע</h1>

      <div class="card event-box">
        <div class="event-title">{{ event_name }}</div>
        <div class="event-line">{{ event_date }}{% if event_time %} | {{ event_time }}{% endif %}</div>
        {% if location %}
          <div class="event-line">{{ location }}</div>
        {% endif %}
        {% if tickets %}
          <div class="event-line">יש לכם {{ tickets }} כרטיסים</div>
        {% endif %}

        <div class="actions">
          <button class="btn" onclick="sendStatus('yes')">אישור הגעה</button>
          <button class="btn secondary" onclick="sendStatus('no')">ביטול</button>
        </div>

        <div id="confirmMsg" class="msg"></div>
      </div>
    {% endif %}

    <div class="card">
      <div class="upload-title">אפשר לצרף תמונה או PDF (עד 5MB)</div>

      <form id="uploadForm">
        <input type="hidden" name="family_id" value="{{ family_id }}">

        <div class="file-row">
          <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png,.webp,.pdf">
        </div>

        <button type="submit" class="btn">העלאת תמונה / PDF</button>
      </form>

      <div id="uploadMsg" class="msg"></div>
    </div>
  </div>

  <script>
    async function sendStatus(status) {
      const msg = document.getElementById("confirmMsg");
      msg.className = "msg";
      msg.textContent = "שולח...";

      try {
        const res = await fetch("/submit", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            event_id: "{{ event_id }}",
            family_id: "{{ family_id }}",
            family_name: "{{ family_name }}",
            event_name: "{{ event_name }}",
            status: status,
            tickets: {{ tickets or 0 }}
          })
        });

        const data = await res.json();

        if (!data.success) {
          msg.className = "msg error";
          msg.textContent = data.error || "שגיאה בשליחה";
          return;
        }

        window.location.href = `/thanks?status=${status}&qty={{ tickets or 0 }}&event_id={{ event_id }}&family_id={{ family_id }}`;
      } catch (e) {
        msg.className = "msg error";
        msg.textContent = "שגיאה בשליחה";
      }
    }

    document.getElementById("uploadForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const msg = document.getElementById("uploadMsg");
      const fileInput = document.getElementById("photo");

      msg.className = "msg";
      msg.textContent = "";

      if (!fileInput.files.length) {
        msg.className = "msg error";
        msg.textContent = "נא לבחור קובץ";
        return;
      }

      const file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) {
        msg.className = "msg error";
        msg.textContent = "הקובץ גדול מ-5MB";
        return;
      }

      const formData = new FormData(this);

      msg.textContent = "מעלה...";

      try {
        const res = await fetch("/upload_file", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!data.success) {
          msg.className = "msg error";
          msg.textContent = data.error || "שגיאה בהעלאה";
          return;
        }

        msg.className = "msg ok";
        msg.textContent = "הקובץ הועלה בהצלחה";
        fileInput.value = "";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "שגיאה בהעלאה";
      }
    });
  </script>
</body>
</html>
