<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אישור הגעה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#ffffff;
    text-align:center;
">

<div style="max-width:420px; margin:0 auto; padding:20px;">

    <img
        src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
        alt="לוגו אור למשפחות"
        style="display:block; width:100%; max-width:260px; margin:0 auto 24px auto;"
    >

    <h1 style="color:#0b5fa5;">אישור הגעה</h1>

    <p style="font-size:17px; line-height:1.6;">
        אנא אשרו את הגעתכם לאירוע
    </p>

    <p style="font-size:16px; color:#555;">
        בשלב זה – אישור בלבד  
        (בחירת אירוע ורישום ייפתחו בהמשך)
    </p>

    <div style="margin-top:30px;">
        <button style="
            width:220px;
            padding:14px;
            font-size:16px;
            background:#0b5fa5;
            color:#ffffff;
            border:none;
            border-radius:6px;
            margin-bottom:12px;
        ">
            מגיעים
        </button>

        <br>

        <button style="
            width:220px;
            padding:14px;
            font-size:16px;
            background:#f28c28;
            color:#ffffff;
            border:none;
            border-radius:6px;
        ">
            לא מגיעים
        </button>
    </div>

</div>

</body>
</html>
