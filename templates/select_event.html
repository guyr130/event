<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>בחירת אירוע</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
  margin:0;
  padding:0;
  font-family: Arial, Helvetica, sans-serif;
  direction: rtl;
  text-align: center;
  background: #ffffff;
">

<div style="max-width:420px; margin:0 auto; padding:20px;">

  <img
    src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
    alt="לוגו אור למשפחות"
    style="display:block; width:100%; max-width:260px; margin:0 auto 18px auto;"
  >

  <h1 style="color:#0b5fa5; margin: 8px 0 6px 0;">בחירת אירוע</h1>

  <p style="font-size:17px; margin: 0 0 18px 0;">
    משפחת <strong>{{ family_name }}</strong> היקרה,<br>
    נא לבחור אירוע לאישור הגעה:
  </p>

  {% for ev in events %}
    <div style="
      border:1px solid #e6e6e6;
      border-radius:10px;
      padding:14px;
      margin-bottom:12px;
      text-align:right;
    ">
      <div style="font-size:16px;">
        <strong>{{ ev.event_name }}</strong>
      </div>

      <div style="font-size:14px; margin-top:6px; line-height:1.5;">
        📅 {{ ev.event_date }} &nbsp; | &nbsp; 🕒 {{ ev.event_time }}<br>
        📍 {{ ev.location }}<br>
        🎟️ אושרו: <strong>{{ ev.tickets_approved }}</strong>
      </div>

      <div style="margin-top:12px; text-align:center;">
        <a href="/confirm?family_id={{ family_id }}&event_id={{ ev.event_id }}"
           style="
             display:inline-block;
             padding:12px 18px;
             background:#0b5fa5;
             color:#fff;
             border-radius:8px;
             text-decoration:none;
             font-size:15px;
           ">
          לאישור הגעה
        </a>
      </div>
    </div>
  {% endfor %}

</div>

</body>
</html>
