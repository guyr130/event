<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>בחירת אירוע</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f2f2f2;
      text-align:center;
      color:#123;
    }

    .wrap{
      max-width:600px;
      margin:0 auto;
      padding:24px 16px 40px;
    }

    /* לוגו */
    .logo{
      width:220px;
      max-width:100%;
      height:auto;
      margin:0 auto 10px;
      display:block;
    }

    h1{
      color:#005aa7;
      margin:8px 0 22px;
      font-size:24px;
    }

    /* כרטיס */
    .card{
      background:#fff;
      border-radius:18px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      padding:24px 18px;
      margin:18px auto;
      width:100%;
      max-width:440px; /* 🔥 אותו יחס כמו confirm */
    }

    .event-link{
      display:block;
      background:#0a67b2;
      color:#fff;
      text-decoration:none;
      padding:14px;
      border-radius:12px;
      margin:10px 0;
      font-size:18px;
    }

    .event-link:hover{
      background:#095a99;
    }

    .upload-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    input[type="file"]{
      font-size:16px;
      margin-top:10px;
    }

    .btn{
      background:#0a67b2;
      color:#fff;
      border:none;
      border-radius:12px;
      padding:14px 26px;
      font-size:18px;
      cursor:pointer;
      margin-top:10px;
    }

    .btn:hover{
      background:#095a99;
    }

    .msg{
      margin-top:12px;
      font-size:16px;
    }

    .msg.error{
      color:#c40000;
    }

    .msg.ok{
      color:#138000;
    }

  </style>
</head>

<body>

<div class="wrap">

  <!-- לוגו -->
  <img class="logo" src="{{ url_for('static', filename='logo.png') }}">

  <h1>אנא בחרו את האירוע הרצוי</h1>

  <!-- אירועים -->
  <div class="card">

    {% for ev in events %}
      <a class="event-link"
         href="/confirm?family_id={{ family_id }}&event_id={{ ev.event_id }}">
        {{ ev.event_name }} | {{ ev.event_date }}{% if ev.event_time %} | {{ ev.event_time }}{% endif %}
      </a>
    {% endfor %}

  </div>

  <!-- העלאת קובץ -->
  <div class="card">

    <div class="upload-title">
      אפשר לצרף תמונה או PDF (עד 5MB)
    </div>

    <form id="uploadForm">
      <input type="hidden" name="family_id" value="{{ family_id }}">

      <input type="file" id="photo" name="photo">

      <br><br>

      <button type="submit" class="btn">
        העלאת תמונה / PDF
      </button>
    </form>

    <div id="uploadMsg" class="msg"></div>

  </div>

</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const msg = document.getElementById("uploadMsg");
  const file = document.getElementById("photo").files[0];

  if (!file) {
    msg.className = "msg error";
    msg.textContent = "בחר קובץ";
    return;
  }

  const formData = new FormData(this);

  msg.textContent = "מעלה...";

  const res = await fetch("/upload_file", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (!data.success) {
    msg.className = "msg error";
    msg.textContent = "שגיאה";
    return;
  }

  msg.className = "msg ok";
  msg.textContent = "הועלה בהצלחה";
});
</script>

</body>
</html>
