<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>תודה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
    margin:0;
    padding:0;
    font-family: Arial, Helvetica, sans-serif;
    direction: rtl;
    text-align: center;
    background: #ffffff;
">

<div style="max-width:420px; margin:0 auto; padding:20px;">

    <img
        src="https://www.or4family.org.il/wp-content/uploads/2025/11/logo-1.png"
        style="width:200px; margin-bottom:20px;"
    >

    {% if status == "yes" %}
        <h2 style="color:#0b5fa5;">אישורכם נקלט 💙</h2>

        <p>נרשמה הגעה עבור <strong>{{ qty }}</strong> משתתפים</p>
        <p>נתראה באירוע</p>

        <p style="margin-top:25px; font-size:16px;">
            הציגו קוד זה בעמדת הרישום
        </p>

        <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=event={{ event_id }}&family={{ family_id }}"
            alt="QR לרישום"
            style="margin-top:10px;"
        >

    {% else %}
        <h2 style="color:#f28c28;">העדכון נקלט</h2>
        <p>מצטערים שלא תגיעו</p>
        <p>נתראה באירועים אחרים</p>
    {% endif %}

</div>

</body>
</html>
